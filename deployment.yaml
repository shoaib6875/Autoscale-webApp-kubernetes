apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscale-demo
  namespace: autoscale-demo
  labels:
    app.kubernetes.io/name: autoscale-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: autoscale-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoscale-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace this placeholder with your built/published image before applying.
          image: ghcr.io/REPLACE_WITH_GITHUB_USERNAME/autoscale-cloud-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "0.1.0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
